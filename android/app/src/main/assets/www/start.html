<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prego</title>
<style>
  body { margin: 0; font-family: sans-serif; background: #f4f6f9;
         display: flex; min-height: 100vh; align-items: center;
         justify-content: center; }
  .card { background: #fff; border-top: 4px solid #d00000;
          border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.15);
          padding: 28px 24px; margin: 16px; max-width: 380px;
          text-align: center; }
  img { width: 84px; border-radius: 18px; }
  h1 { color: #d00000; margin: 12px 0 4px; }
  p { color: #555; line-height: 1.4; }
  button { background: #d00000; color: #fff; border: 0;
           border-radius: 6px; padding: 14px 26px; font-size: 17px;
           font-weight: bold; margin-top: 10px; }
  button:active { background: #a00000; }
  @media (prefers-color-scheme: dark) {
    body { background: #343a40; }
    .card { background: #454d55; }
    p { color: #ccc; }
    h1 { color: #ff6b6b; }
  }
</style>
</head>
<body>
  <div class="card">
    <img src="/static/icon-192.png" alt="Prego">
    <h1>Prego</h1>
    <p>La liturgia del giorno, ogni giorno, anche senza rete.</p>
    <p>Per iniziare scarica i dati sul telefono: serve la connessione
       solo questa prima volta.</p>
    <button onclick="scarica()">Scarica i dati</button>
  </div>
  <script>
    function scarica() {
      if (typeof PregoApp !== "undefined") { PregoApp.sync(); }
    }
  </script>
</body>
</html>
